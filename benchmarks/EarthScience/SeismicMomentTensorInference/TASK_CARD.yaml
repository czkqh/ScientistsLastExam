schema_version: 2
scientific_question: Can an actively designed small P/S network recover a local earthquake moment tensor and depth, while refusing null or isotropic sources outside the declared family?
artifact: Six normalized symmetric moment-tensor components, hypocentral depth and magnitude, confidence, or an explicit abstention.
oracle:
  model: deterministic point-source P/S radiation and travel-time simulator with seeded Gaussian amplitude and arrival noise
  feasibility: charged 4-12 station surveys in a 300 km square under an eight-unit budget; bounded finite tensor/depth output
  deterministic: true
normalization:
  baseline: one four-station P-wave corner survey followed by abstention
  reference: bounded nonlinear least-squares P/S inversion with broad azimuthal coverage and refusal on unsupported sources
  score: development mechanism quality normalized above all-abstain; held-out prediction, refusal, false discovery and coverage are separate
citations:
  - id: doi:10.1016/j.epsl.2015.02.022
    title: Moment tensor inversion for near-surface events
  - id: doi:10.1111/j.1365-246X.1987.tb05275.x
    title: Quantitative seismology and source radiation
invariants:
  - identical candidate calls produce byte-stable world noise and scores
  - P radiation is n-transpose-M-n and S radiation is a transverse projection of M-n
  - all-abstain has exactly zero normalized mechanism score
  - malformed returns, callback errors and budget overspend score invalid without evaluator crashes
  - isotropic and null worlds reward abstention and count false discoveries with an explicit denominator
  - held-out mechanism and prediction diagnostics are not search-visible
known_shortcuts: A four-corner P-only survey cannot identify all off-diagonal components or separate depth from magnitude. The reduced-order point-source model omits finite-fault, attenuation and 3-D structure; server-held stations, full waveform modeling and independent seismological review are required before certification.
